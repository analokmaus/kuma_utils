[project]
name = "kuma_utils"
version = "0.7.0"
description = ""
authors = [{ name = "Hiroshi Yoshihara", email = "no14nec0@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "torch==2.5.0+cu121; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.5.0; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "torchvision==0.20.0+cu121; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.20.0+cu121; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "torchaudio==2.5.0+cu121; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchaudio==2.5.0+cu121; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "ipykernel~=6.29.0",
    "jupyter~=1.0.0",
    "scipy~=1.12.0",
    "seaborn~=0.13.2",
    "lightgbm~=4.3.0",
    "catboost~=1.2.2",
    "xgboost~=1.7.6",
    "optuna~=3.5.0",
    "torchsummary~=1.5.1",
    "pyarrow~=15.0.0",
    "tensorboard~=2.15.1",
    "scikit-learn~=1.4.0",
    "japanize-matplotlib~=1.1.3",
    "openpyxl~=3.1.2",
    "wandb~=0.16.3",
    "timm~=0.9.12",
    "matplotlib-venn~=0.11.10",
]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest~=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
